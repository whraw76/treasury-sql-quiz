name: SQL quiz checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q -m 'not integration'
  hosted-postgres:
    # Fork PRs do not receive Secrets. A main-branch run must pass this job.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: tests
    env:
      QUERY_DATABASE_URL: ${{ secrets.QUERY_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify hosted database and all quiz hints
        run: python scripts/verify_live.py
